name: Build Ishraqa APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Ishraqa Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          unzip -o "$ZIP_FILE" -x ".github/*"

      - name: Download Tajawal Arabic Fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Medium.ttf" -o app/src/main/assets/fonts/tajawal_medium.ttf || true
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf" -o app/src/main/assets/fonts/tajawal_bold.ttf || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Ishraqa APK
        uses: actions/upload-artifact@v4
        with:
          name: Ishraqa-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
